<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading SolidCraft&hellip;</span></div>
  <script>
    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
    // Touch fork: Android reports the S Pen side button only as a `contextmenu` (no pointer press,
    // and nothing at all while it is held), so the page turns it into a right-click there. A
    // finger's long press also fires `contextmenu`; that one is left to the app, which opens its
    // tool ring for it (crates/ui-egui/src/viewport.rs).
    (() => {
      // A finger's long press starts with a touch press not yet lifted (the browser may cancel it
      // as the long press begins), while the pen button's `contextmenu` comes with no press at all.
      let touchDown = -1e9, touchUp = -1e9;
      addEventListener("pointerdown", (e) => { if (e.isTrusted && e.pointerType === "touch") touchDown = performance.now(); }, true);
      addEventListener("pointerup", (e) => { if (e.isTrusted && e.pointerType === "touch") touchUp = performance.now(); }, true);
      addEventListener("touchstart", (e) => { if (e.isTrusted) touchDown = performance.now(); }, true);
      addEventListener("touchend", (e) => { if (e.isTrusted && e.touches.length === 0) touchUp = performance.now(); }, true);
      addEventListener("contextmenu", (e) => {
        if (!e.isTrusted || e.button === 2) return;
        e.preventDefault();
        const now = performance.now();
        const finger = touchDown > touchUp && now - touchDown < 3000;
        const pen = !finger;
        if (!pen) return;
        e.stopImmediatePropagation();
        const canvas = document.getElementById("solidcraft_canvas");
        if (!canvas) return;
        const init = { bubbles: true, cancelable: true, pointerId: 999, pointerType: "mouse", button: 2, clientX: e.clientX, clientY: e.clientY };
        canvas.dispatchEvent(new PointerEvent("pointerdown", { ...init, buttons: 2 }));
        setTimeout(() => document.dispatchEvent(new PointerEvent("pointerup", { ...init, buttons: 0 })), 50);
      }, true);
    })();
  </script>
</body>
